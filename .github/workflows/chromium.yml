name: Chromium PWA checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Serve static PWA
        run: |
          python -m http.server 8080 > /tmp/moneytracker-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/moneytracker-http.log
          exit 1
      - name: Run Chromium checks
        run: python -m pytest -q tests/browser
        env:
          MONEYTRACKER_BASE_URL: http://127.0.0.1:8080
